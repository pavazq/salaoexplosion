<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Conheça o espaço do Salão Explosion — Diadema, SP.">
  <meta name="theme-color" content="#0a0011">
  <title>Nosso Espaço — Salão Explosion</title>
  <link rel="stylesheet" href="css/style.css?v=20260507c">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <style>
    body { background: var(--bg-deep); }

    .espaco-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(var(--header-height) + 2.5rem) clamp(1rem, 4vw, 3rem) clamp(3rem, 6vw, 5rem);
    }

    /* Vídeo — bloco acima, ocupando o máximo de largura */
    .espaco-video-block {
      width: 100%;
      max-width: 960px;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 16/9;
      box-shadow: 0 32px 90px rgba(0,0,0,0.7), 0 0 0 1.5px rgba(177,78,255,0.2);
    }

    .espaco-video-block iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Info abaixo do vídeo */
    .espaco-info {
      width: 100%;
      max-width: 960px;
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .espaco-info__text {
      flex: 1;
      min-width: 200px;
    }

    .espaco-info__text p {
      color: var(--text-light-secondary);
      font-size: 1rem;
      line-height: 1.7;
      margin: 0;
    }

    @media (max-width: 600px) {
      .espaco-info {
        flex-direction: column;
        align-items: stretch;
      }
      .espaco-info .btn-cta {
        text-align: center;
      }
    }
  </style>
</head>
