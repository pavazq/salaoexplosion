<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0011">
  <title>Página não encontrada — Salão Explosion</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <style>
    body { background: var(--bg-deep); overflow-x: hidden; }

    /* Partículas flutuantes */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: float-up linear infinite;
    }
    @keyframes float-up {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.35; }
      90%  { opacity: 0.08; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    .notfound-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--header-height) + 2rem) clamp(1rem, 4vw, 3rem) 4rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Área do GIF + número 404 sobreposto */
    .notfound-visual {
      position: relative;
      width: 100%;
      max-width: 500px;
      height: clamp(200px, 40vw, 340px);
      background: url('https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif') center/contain no-repeat;
      margin-bottom: -1rem;
    }

    .notfound-code {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse-glow 3s ease-in-out infinite;
      white-space: nowrap;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 16px rgba(177,78,255,0.5)); }
      50%       { filter: drop-shadow(0 0 36px rgba(177,78,255,0.9)); }
    }

    .notfound-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 0.75rem;
    }

    .notfound-desc {
      color: rgba(237,230,247,0.7);
      font-size: 1.05rem;
      line-height: 1.8;
      max-width: 440px;
      margin: 0 auto 2.5rem;
    }

    .notfound-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .notfound-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(177,78,255,0.08) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <header class="header" id="header">
    <a href="index.html" class="header__logo">
      <img src="assets/img/logo-explosion.png" alt="Salão Explosion">
    </a>
    <nav class="header__nav">
      <a href="servicos.html">Serviços</a>
      <a href="massagens/index.html">Massagens</a>
      <a href="equipe.html">Equipe</a>
      <a href="contato.html">Contato</a>
      <a href="#" class="btn-cta" data-whatsapp="Olá! Gostaria de agendar um horário no Salão Explosion.">Agende seu horário</a>
    </nav>
    <div class="header__toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </div>
  </header>

  <div class="mobile-menu">
    <a href="servicos.html">Serviços</a>
    <a href="massagens/index.html">Massagens</a>
    <a href="equipe.html">Equipe</a>
    <a href="contato.html">Contato</a>
    <a href="#" class="btn-cta btn-cta-solid" data-whatsapp="Olá! Gostaria de agendar um horário no Salão Explosion." style="margin-top:1rem;">Agendar pelo WhatsApp</a>
  </div>

  <!-- Partículas -->
  <div class="particles" id="particles"></div>

  <main class="notfound-page">
    <div class="notfound-glow"></div>

    <div class="notfound-visual" aria-hidden="true">
      <div class="notfound-code">404</div>
    </div>

    <h1 class="notfound-title">Essa página não existe</h1>
    <p class="notfound-desc">O link que você acessou foi removido ou nunca existiu.<br>Mas a gente ainda pode te ajudar.</p>
    <div class="notfound-actions">
      <a href="index.html" class="btn-cta btn-cta-solid">← Página inicial</a>
      <a href="#" class="btn-cta" data-whatsapp="Olá! Tentei acessar uma página do site e não encontrei. Pode me ajudar?">💬 Entrar em contato</a>
    </div>
  </main>

  <a href="#" class="whatsapp-float" data-whatsapp="Olá! Gostaria de agendar um horário no Salão Explosion." aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <script src="js/main.js"></script>
  <script>
    // Partículas flutuantes
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 6 + 3;
      p.style.cssText = `
        width:${size}px;height:${size}px;
        left:${Math.random()*100}%;
        animation-duration:${Math.random()*10+8}s;
        animation-delay:${Math.random()*8}s;
        background:${Math.random()>0.5?'#b14eff':'#e46aa0'};
      `;
      container.appendChild(p);
    }
  </script>
</body>
</html>
