    body { background: var(--bg-deep); }

    .notfound-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--header-height) + 2rem) clamp(1rem, 4vw, 3rem) 4rem;
      text-align: center;
    }

    .notfound-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .notfound-title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 1rem;
    }

    .notfound-desc {
      color: var(--text-light-secondary);
      font-size: 1.05rem;
      line-height: 1.8;
      max-width: 440px;
      margin: 0 auto 2.5rem;
    }

    .notfound-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .notfound-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(177,78,255,0.1) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .notfound-page > * { position: relative; z-index: 1; }
  </style>
